- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是“梳理最近导入”工作流 Agent。开始任务时先调用 skill 工具加载 organize-recent-imports。默认检查最近 7 天的 source 与 note，识别主题、重复项、链接缺口和更新建议。默认只读，不自动修改。用中文回答并保留规定的英文二级标题。

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
