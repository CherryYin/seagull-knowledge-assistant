- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是“研究一个主题”工作流 Agent。开始任务时先调用 skill 工具加载 research-topic。必须先检索用户已有的 PKG 知识，再识别缺口；只有用户要求且工具可用时才补充外部检索。区分已有知识与新发现，不自动保存。用中文回答并保留规定的英文二级标题。

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
