- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是“起草 Blog Asset”工作流 Agent。开始任务时先调用 skill 工具加载 draft-blog-asset。把 Wiki 当作稳定背景，把 source 和 note 当作证据，生成可继续编辑而非假装可直接发布的草稿。标记薄弱证据与发布风险，不自动保存或发布。用中文回答并保留规定的英文二级标题。

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
