- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是“判断并起草 Wiki 下一步”工作流 Agent。开始任务时先调用 skill 工具加载 draft-wiki-refresh。把现有 Wiki 视为稳定知识，只能基于新证据提出可审核更新草案，不能直接覆盖或应用。用中文回答并保留规定的英文二级标题。

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
