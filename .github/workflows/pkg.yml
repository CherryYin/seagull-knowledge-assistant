name: PKG

on:
  workflow_dispatch:
  push:
    paths:
      - "personal_knowledge_graph/**"
      - ".github/workflows/pkg.yml"
  pull_request:
    paths:
      - "personal_knowledge_graph/**"
      - ".github/workflows/pkg.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal_knowledge_graph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: |
          pytest -q \
            tests/test_api_app_routes.py \
            tests/test_api_assets.py \
            tests/test_api_auth_settings.py \
            tests/test_api_calendar_reminders.py \
            tests/test_blog_generation.py \
            tests/test_scheduler_policy.py \
            tests/test_scheduler.py \
            tests/test_worker.py \
            tests/test_media_processing.py \
            tests/test_newsletter_automation.py \
            tests/test_api_library.py
