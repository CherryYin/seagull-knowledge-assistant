name: Gateway

on:
  workflow_dispatch:
  push:
    paths:
      - "bff/**"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "bff/**"
      - ".github/workflows/gateway.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deepseek-knowledge-lab/package-lock.json
      - run: npm ci --prefix ../deepseek-knowledge-lab
      - run: npm install
      - run: npm test
