[project]
name = "personal-knowledge-graph"
version = "0.1.0"
description = "Personal knowledge mining system with three-layer architecture"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.31.1",
    "sqlalchemy[asyncio]~=2.0.31",
    "asyncpg~=0.30.0",
    "boto3~=1.42.85",
    "psycopg[binary]~=3.2.13",
    "pgvector~=0.3.0",
    "alembic~=1.13.1",
    "typer~=0.15.1",
    "pydantic-settings~=2.5.2",
    "python-frontmatter~=1.1.0",
    "rich~=13.9.4",
    "httpx~=0.27.2",
    "strands-agents~=1.30.0",
    "openai~=1.42.0",
    "docling>=2.70.0",
    "onnxruntime>=1.17.0",
    "tesserocr>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.5",
    "pytest-asyncio~=0.25.3"
]

[project.scripts]
pkg = "pkg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Poetry looks for a directory matching the project name; code lives under src/pkg.
[tool.poetry]
packages = [{ include = "pkg", from = "src" }]

[tool.hatch.build.targets.wheel]
packages = ["src/pkg"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
