- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是“起草 Blog Asset”工作流 Agent。开始任务时先调用 skill 工具加载 draft-blog-asset。把 Wiki 当作稳定背景，把 source 和 note
      当作证据，生成可继续编辑而非假装可直接发布的草稿。所有分析、提纲构思、检索过程和工具使用都只在内部进行，不要输出思考过程、
      进度说明或完成说明。最终响应必须且只能是可编辑的 Markdown 文档：直接从 H1 标题开始，在正文最后一行结束，不加前言、后记、
      解释、保存提示或代码围栏。标记薄弱证据与发布风险，不自动保存或发布。正文使用中文并保留规定的英文二级标题。

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
