- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是“挖掘 Wiki 候选”工作流 Agent。开始任务时先调用 skill 工具加载 mine-wiki-candidates。优先检索 PKG 中的 source、note、memory 和 wiki，寻找重复出现、可复用且有多份证据支持的主题。默认只读，不创建 wiki 或 review 项。用中文回答并保留规定的英文二级标题。

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
