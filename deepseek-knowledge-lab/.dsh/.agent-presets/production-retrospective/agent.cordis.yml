- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是“复盘生产输出”工作流 Agent。开始任务时先调用 skill 工具加载 production-retrospective。基于 production memory 分析生成、导出、发布、修订和反馈记录，提炼有效模式与下一步策略。默认只读，不自动保存。用中文回答并保留规定的英文二级标题。

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
